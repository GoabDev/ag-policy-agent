<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A&G Policy Agent</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: oklch(0.145 0 0);
      color: oklch(0.985 0 0);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      max-width: 400px;
    }

    .logo-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, oklch(0.488 0.243 264.376), oklch(0.488 0.243 264.376 / 0.7));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 8px 24px oklch(0.488 0.243 264.376 / 0.25);
    }

    .logo-icon svg {
      width: 28px;
      height: 28px;
      color: white;
      stroke: white;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      color: oklch(0.985 0 0);
    }

    .subtitle {
      font-size: 13px;
      font-weight: 400;
      color: oklch(0.708 0 0);
      margin-bottom: 40px;
    }

    .progress-track {
      width: 200px;
      height: 3px;
      background: oklch(0.275 0 0);
      border-radius: 3px;
      margin: 0 auto 28px;
      overflow: hidden;
    }

    .progress-bar {
      width: 40%;
      height: 100%;
      background: oklch(0.488 0.243 264.376);
      border-radius: 3px;
      animation: progress 1.5s ease-in-out infinite;
    }

    @keyframes progress {
      0% { transform: translateX(-100%); width: 40%; }
      50% { width: 60%; }
      100% { transform: translateX(350%); width: 40%; }
    }

    #status {
      font-size: 13px;
      font-weight: 500;
      color: oklch(0.985 0 0 / 0.8);
      margin-bottom: 6px;
    }

    #details {
      font-size: 12px;
      color: oklch(0.556 0 0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-icon">
      <!-- Lucide Zap icon (inline SVG) -->
      <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
    </div>
    <div class="title">A&G Policy Agent</div>
    <div class="subtitle">Automated policy management system</div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
    <div id="status">Starting services...</div>
    <div id="details">This may take a few seconds</div>
  </div>
</body>
</html>
